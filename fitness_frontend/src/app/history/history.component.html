<div class="history-container">
  <h2>Workout History</h2>
  <div *ngIf="loading">Loading workout history...</div>
  <div *ngIf="errorMsg" class="error">{{ errorMsg }}</div>
  <table *ngIf="!loading && workouts.length">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Proof</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let workout of workouts">
        <td>{{ workout.date || workout.timestamp | date:'short' }}</td>
        <td>{{ workout.type || (workout.data ? workout.data.type : '') }}</td>
        <td>
          <a *ngIf="workout.proofUrl" [href]="workout.proofUrl" target="_blank">View</a>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!loading && !workouts.length">No workouts found.</div>
  <a routerLink="/dashboard">← Back to Dashboard</a>
</div>
