<div class="auth-container">
  <h2 *ngIf="mode==='login'">Login</h2>
  <h2 *ngIf="mode==='register'">Register</h2>
  <form (ngSubmit)="onSubmit()" #authForm="ngForm" novalidate>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
      [disabled]="loading"
    />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
      [disabled]="loading"
    />
    <button type="submit" [disabled]="loading || !email || !password">
      {{ mode === 'login' ? 'Login' : 'Register' }}
    </button>
    <div *ngIf="errorMsg" class="error">{{ errorMsg }}</div>
  </form>
  <a href="#" (click)="switchMode(); $event.preventDefault();">
    {{ mode === 'login' ? 'No account? Register here' : 'Already have an account? Login' }}
  </a>
</div>
